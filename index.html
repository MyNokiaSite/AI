<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ретро LLM Чат</title>
    <style>
        body { font-family: sans-serif; margin: 10px; background: #f0f0f0; color: #000; }
        #chat { max-width: 600px; margin: 0 auto; }
        .msg { padding: 8px; margin-bottom: 5px; border-radius: 5px; white-space: pre-wrap; }
        .user { background: #dcf8c6; text-align: right; }
        .bot { background: #fff; }
        input[type="text"] { width: 70%; padding: 8px; }
        button { padding: 8px 15px; }
        #status { font-size: 0.8em; color: #666; margin-top: 5px; }
    </style>
</head>
<body>
    <div id="chat">
        <h2>Ретро LLM Чат</h2>
        <div id="log"></div>
        <div id="status"></div>
        <br>
        <input type="text" id="input" placeholder="Ваш вопрос..." autocomplete="off">
        <button onclick="sendMessage()">Отправить</button>
    </div>

    <script>
        const log = document.getElementById('log');
        const status = document.getElementById('status');
        const input = document.getElementById('input');
        let useLLM7 = true; 
        
        // Массив для хранения истории диалога
        let chatHistory = [];

        function addMessage(text, sender) {
            const div = document.createElement('div');
            div.className = `msg ${sender}`;
            div.textContent = text;
            log.appendChild(div);
            window.scrollTo(0, document.body.scrollHeight);
        }

        async function fetchLLM7(history) {
            const response = await fetch('https://api.llm7.io/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    model: 'gpt-oss:20b',
                    messages: history
                })
            });
            if (!response.ok) throw new Error(`LLM7: ${response.status}`);
            const data = await response.json();
            return data.choices[0].message.content;
        }

        async function fetchPollinations(history) {
            const response = await fetch('https://text.pollinations.ai/', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    messages: history
                })
            });
            if (!response.ok) throw new Error(`Pollinations: ${response.status}`);
            return await response.text();
        }

        async function sendMessage() {
            const text = input.value.trim();
            if (!text) return;

            addMessage(text, 'user');
            input.value = '';
            status.textContent = 'Думаю...';

            // Добавляем сообщение пользователя в историю
            chatHistory.push({ role: "user", content: text });

            // ВАЖНО ДЛЯ NOKIA: Ограничиваем историю последними 6 сообщениями (3 пары).
            // Иначе память старого телефона переполнится, а API начнет ругаться на длину контекста.
            if (chatHistory.length > 6) {
                chatHistory = chatHistory.slice(-6); 
            }

            let reply = '';
            try {
                if (useLLM7) {
                    reply = await fetchLLM7(chatHistory);
                } else {
                    reply = await fetchPollinations(chatHistory);
                }
            } catch (err) {
                if (useLLM7) {
                    useLLM7 = false;
                    status.textContent = 'LLM7 недоступен, переключаюсь на Pollinations...';
                    try {
                        reply = await fetchPollinations(chatHistory);
                    } catch (err2) {
                        reply = 'Ошибка: ' + err2.message;
                    }
                } else {
                    reply = 'Ошибка: ' + err.message;
                }
            }

            // Добавляем ответ бота в историю и на экран
            chatHistory.push({ role: "assistant", content: reply });
            
            addMessage(reply, 'bot');
            status.textContent = '';
        }

        input.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
